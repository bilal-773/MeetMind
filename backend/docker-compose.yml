version: "3.9"

services:
  # FastAPI Backend
  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
      - /tmp:/tmp    # Temp audio files

  # Celery Worker (AI pipeline)
  worker:
    build: .
    env_file: .env
    depends_on:
      - redis
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=1
    volumes:
      - .:/app
      - /tmp:/tmp
    # Uncomment for GPU support:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # Redis (Celery broker + result backend)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Flower (Celery monitoring UI — optional)
  flower:
    build: .
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      - redis
    command: celery -A app.workers.celery_app flower --port=5555

volumes:
  redis_data:
